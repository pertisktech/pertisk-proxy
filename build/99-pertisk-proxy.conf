# Kernel tuning for pertisk-proxy (HTTP/1–3 reverse proxy).
# Installed as /etc/sysctl.d/99-pertisk-proxy.conf
#
# Applied on package install (sysctl -p) and on boot.
# Safe to leave in place; values only raise ceilings, they do not force
# sockets to use them (the proxy sets SO_RCVBUF/SO_SNDBUF itself).

# Allow large UDP/TCP socket buffers (proxy requests ~7 MiB for QUIC).
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Accept / SYN backlog for high connection rates.
net.core.somaxconn = 8192
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 8192

# Prefer BBR for TCP (HTTP/1 + HTTP/2 path). QUIC congestion is separate.
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq

# Ephemeral ports for many concurrent upstream connections.
net.ipv4.ip_local_port_range = 1024 65535
net.ipv4.tcp_tw_reuse = 1
