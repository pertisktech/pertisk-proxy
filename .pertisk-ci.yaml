on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  build-docker:
    runs-on: docker
    timeout_minutes: 120
    steps:
      - name: docker login
        run: |
          test -n "$CI_REGISTRY" || (echo "CI_REGISTRY is empty" && exit 1)
          test -n "$CI_REGISTRY_USER" || (echo "CI_REGISTRY_USER is empty" && exit 1)
          test -n "$CI_REGISTRY_PASSWORD" || (echo "CI_REGISTRY_PASSWORD is empty" && exit 1)
          echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
          if ! docker buildx inspect mybuilder >/dev/null 2>&1; then
            docker buildx create --use --name mybuilder
          fi
          docker buildx use mybuilder
          docker buildx inspect --bootstrap mybuilder
      - name: build and push docker
        run: |
          IMAGE_REPO="${IMAGE_REPO:-gitdev.tools.pertisk.com/pertisktech/pertisk-proxy}"
          IMAGE_TAG="${IMAGE_TAG:-v0.1.${{ secrets.CI_PIPELINE_IID }}}"
          IMAGE="$IMAGE_REPO:$IMAGE_TAG"
          CACHE_REF="$IMAGE_REPO:buildcache"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            -t "$IMAGE" \
            --cache-from type=registry,ref="$CACHE_REF" \
            --cache-to type=registry,ref="$CACHE_REF",mode=max \
            -f Dockerfile --push .