# Unit-test coverage gate (95%). Integration-heavy modules are excluded because they
# require live network, Kubernetes, or multi-process orchestration.
[run]
fail-under = 95
out = ["Stdout"]
exclude-files = [
    "src/api/mod.rs",
    "src/api/kubernetes.rs",
    "src/api/acme.rs",
    "src/bin/ingress.rs",
    "src/controller.rs",
    "src/db/mod.rs",
    "src/db/schema.rs",
    "src/h3/quinn_server.rs",
    "src/h3/server.rs",
    "src/ingress/controller.rs",
    "src/ingress/gateway_api.rs",
    "src/ingress/leader_election.rs",
    "src/ingress/mod.rs",
    "src/main.rs",
    "src/proxy/mod.rs",
    "src/server.rs",
    "src/tls/acme.rs",
    "src/tls/dns_01.rs",
    "src/tls/mod.rs",
]
