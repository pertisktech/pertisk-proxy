# Unit-test coverage gate (100%). Integration-heavy modules are excluded because they
# require live network, Kubernetes, databases, SMTP, object storage, or GeoIP DBs.
[run]
fail-under = 100
out = ["Stdout"]
packages = ["pertisk-proxy"]
exclude-files = [
    "src/api/*",
    "src/bin/*",
    "src/config/*",
    "src/controller.rs",
    "src/db/*",
    "src/deny.rs",
    "src/edge/*",
    "src/email/*",
    "src/geoip.rs",
    "src/health.rs",
    "src/ingress/*",
    "src/main.rs",
    "src/log.rs",
    "src/logging.rs",
    "src/metrics.rs",
    "src/runtime.rs",
    "src/server.rs",
    "src/storage/*",
    "src/proxy/mod.rs",
    "src/proxy/apply.rs",
    "src/proxy/routes.rs",
    "src/h3/config.rs",
    "src/h3/headers.rs",
    "src/h3/health.rs",
    "src/h3/mod.rs",
    "src/h3/quinn_server.rs",
    "src/h3/server.rs",
    "src/h3/settings.rs",
    "src/http3_options.rs",
    "src/lib.rs",
    "src/tls/acme.rs",
    "src/tls/config.rs",
    "src/tls/dns_01.rs",
    "src/tls/mod.rs",
    "src/tls/resolver.rs",
    "src/tls/sni.rs",
    "tunnel/*",
    "target/*",
]
