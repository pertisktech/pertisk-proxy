[package]
name = "pertisk-proxy"
version = "0.1.0"
edition = "2021"
description = "Reverse proxy and Kubernetes Ingress controller with HTTP/1, HTTP/2 (Pingora) and HTTP/3 (Quiche)"
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[features]
default = ["admin", "acme", "dns-challenge", "h3-quinn", "prometheus"]
prometheus = ["dep:pingora-prometheus"]
admin = [
    "dep:axum",
    "dep:tower-http",
    "dep:rusqlite",
    "dep:bcrypt",
    "dep:uuid",
    "dep:dashmap",
    "dep:once_cell",
    "dep:sysinfo",
    "dep:local-ip-address",
    "dep:lettre",
    "dep:aws-sdk-s3",
    "dep:aws-credential-types",
    "dep:aws-types",
]
ingress = ["admin"]
acme = ["dep:acme-lib", "dep:openssl"]
dns-challenge = [
    "acme",
    "dep:aws-config",
    "dep:aws-sdk-route53",
    "dep:aws-credential-types",
    "dep:aws-types",
    "dep:yup-oauth2",
    "dep:quick-xml",
    "dep:sha1",
]
# Quinn + rustls HTTP/3 (default; works with ACME/OpenSSL in the same binary).
h3-quinn = ["dep:quinn", "dep:h3", "dep:h3-quinn", "dep:http-body-util"]
# Quiche/tokio-quiche HTTP/3 (optional; incompatible with acme in the same binary).
h3-quiche = ["dep:quiche", "dep:tokio-quiche"]

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["json", "macros", "ws"], optional = true }
bcrypt = { version = "0.19", optional = true }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = { version = "6.2.1", optional = true }
futures = "0.3.34"
http = "1.5.0"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.2.0", features = ["runtime", "derive", "client"] }
schemars = "1.2.2"
once_cell = { version = "1.21.4", optional = true }
pingora = { version = "0.9.0", features = ["proxy", "openssl"] }
pingora-core = { version = "0.9.0", features = ["openssl"] }
pingora-error = "0.9.0"
pingora-http = "0.9.0"
pingora-proxy = { version = "0.9.0", features = ["openssl"] }
pingora-prometheus = { version = "0.9.0", optional = true }
quiche = { version = "0.30.0", optional = true }
reqwest = { version = "0.13.5", features = ["rustls", "json", "query", "form"] }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tower-http = { version = "0.7.1", features = ["cors", "fs"], optional = true }
url = "2.5.8"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-quiche = { version = "0.20.0", optional = true }
tokio-util = { version = "0.7.19", features = ["codec"] }
socket2 = { version = "0.6.5", features = ["all"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"], optional = true }
x509-parser = "0.18.1"
rustls-pemfile = "2.2.0"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
quinn = { version = "0.11.12", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http-body-util = { version = "0.1.5", optional = true }
acme-lib = { version = "0.9.1", optional = true }
openssl = { version = "0.10.81", features = ["vendored"], optional = true }
aws-config = { version = "1.12.0", optional = true }
aws-sdk-route53 = { version = "1.126.0", optional = true }
aws-sdk-s3 = { version = "1.150.0", optional = true }
aws-credential-types = { version = "1.3.0", optional = true }
aws-types = { version = "1.6.0", optional = true }
yup-oauth2 = { version = "12.1.2", optional = true }
quick-xml = { version = "0.42.0", optional = true }
sha1 = { version = "0.10.7", optional = true }
hex = "0.4.3"
local-ip-address = { version = "0.6.13", optional = true }
sysinfo = { version = "0.39.6", optional = true }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"], optional = true }
maxminddb = "0.32.0"
hmac = "0.13.0"
sha2 = "0.11.0"
rand = "0.10.3"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"

[[bin]]
name = "pertisk-proxy"
path = "src/main.rs"

[[bin]]
name = "pertisk-proxy-ingress"
path = "src/bin/ingress.rs"
required-features = ["ingress"]

[workspace]
resolver = "2"
members = [".", "tunnel/proto", "tunnel/server", "tunnel/client"]
default-members = ["."]
