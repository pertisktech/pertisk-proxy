[package]
name = "pertisk-proxy"
version = "0.1.0"
edition = "2021"
description = "Kubernetes Ingress reverse proxy with HTTP/1, HTTP/2 (Pingora) and HTTP/3 (Quiche)"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.9.1"
async-trait = "0.1.89"
bytes = "1.10.1"
futures = "0.3.32"
http = "1.3.1"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.0.0", features = ["runtime", "derive", "client"] }
pingora = { version = "0.8.1", features = ["proxy", "rustls"] }
pingora-core = { version = "0.8.1", features = ["rustls"] }
pingora-error = "0.8.1"
pingora-http = "0.8.1"
pingora-proxy = { version = "0.8.1", features = ["rustls"] }
quiche = "0.29.2"
reqwest = { version = "0.13.4", features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-quiche = "0.19.0"
tokio-util = { version = "0.7.16", features = ["codec"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
