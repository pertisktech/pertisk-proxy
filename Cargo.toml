[package]
name = "pertisk-proxy"
version = "0.1.0"
edition = "2021"
description = "Reverse proxy and Kubernetes Ingress controller with HTTP/1, HTTP/2 (Pingora) and HTTP/3 (Quiche)"
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[features]
default = ["admin", "acme", "dns-challenge", "h3-quinn", "prometheus"]
prometheus = []
admin = [
    "dep:axum",
    "dep:tower-http",
    "dep:rusqlite",
    "dep:bcrypt",
    "dep:uuid",
    "dep:dashmap",
    "dep:once_cell",
    "dep:sysinfo",
    "dep:local-ip-address",
    "dep:lettre",
    "dep:aws-sdk-s3",
    "dep:aws-credential-types",
    "dep:aws-types",
]
ingress = ["admin"]
acme = ["dep:acme-lib", "dep:openssl"]
dns-challenge = [
    "acme",
    "dep:aws-config",
    "dep:aws-sdk-route53",
    "dep:aws-credential-types",
    "dep:aws-types",
    "dep:yup-oauth2",
    "dep:quick-xml",
    "dep:sha1",
    "dep:hex",
]
# Quinn + rustls HTTP/3 (default; works with ACME/OpenSSL in the same binary).
h3-quinn = ["dep:quinn", "dep:h3", "dep:h3-quinn", "dep:http-body-util"]
# Quiche/tokio-quiche HTTP/3 (optional; incompatible with acme in the same binary).
h3-quiche = ["dep:quiche", "dep:tokio-quiche"]

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.9.1"
async-trait = "0.1.89"
axum = { version = "0.8", features = ["json", "macros"], optional = true }
bcrypt = { version = "0.17", optional = true }
bytes = "1.10.1"
chrono = { version = "0.4", features = ["serde"] }
dashmap = { version = "6.0", optional = true }
futures = "0.3.32"
http = "1.3.1"
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
kube = { version = "4.0.0", features = ["runtime", "derive", "client"] }
schemars = "1.0"
once_cell = { version = "1.21", optional = true }
pingora = { version = "0.8.1", features = ["proxy", "openssl"] }
pingora-core = { version = "0.8.1", features = ["openssl"] }
pingora-error = "0.8.1"
pingora-http = "0.8.1"
pingora-proxy = { version = "0.8.1", features = ["openssl"] }
quiche = { version = "0.29.2", optional = true }
reqwest = { version = "0.13.4", features = ["rustls", "json", "query", "form"] }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
tower-http = { version = "0.6", features = ["cors", "fs"], optional = true }
url = "2.5.8"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-quiche = { version = "0.19.0", optional = true }
tokio-util = { version = "0.7.16", features = ["codec"] }
socket2 = { version = "0.5", features = ["all"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.18", features = ["v4"], optional = true }
x509-parser = "0.16.0"
rustls-pemfile = "2.2.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
quinn = { version = "0.11.11", optional = true }
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http-body-util = { version = "0.1", optional = true }
acme-lib = { version = "0.9", optional = true }
openssl = { version = "0.10", features = ["vendored"], optional = true }
aws-config = { version = "1.8", optional = true }
aws-sdk-route53 = { version = "1.115", optional = true }
aws-sdk-s3 = { version = "1.137", optional = true }
aws-credential-types = { version = "1.2", optional = true }
aws-types = { version = "1.3", optional = true }
yup-oauth2 = { version = "12", optional = true }
quick-xml = { version = "0.32", optional = true }
sha1 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
local-ip-address = { version = "0.6", optional = true }
sysinfo = { version = "0.31", optional = true }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"], optional = true }
maxminddb = "0.27"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"

[[bin]]
name = "pertisk-proxy"
path = "src/main.rs"

[[bin]]
name = "pertisk-proxy-ingress"
path = "src/bin/ingress.rs"
required-features = ["ingress"]

[workspace]
resolver = "2"
members = [".", "tunnel/proto", "tunnel/server", "tunnel/client"]
default-members = ["."]
