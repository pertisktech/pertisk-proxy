{{- if .Values.adminIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pertisk-ingress.fullname" . }}-admin
  labels:
    {{- include "pertisk-ingress.labels" . | nindent 4 }}
  annotations:
    # Never apply GeoIP/WAF to the management UI (easy self-lockout).
    proxy.pertisk.tech/security-exempt: "true"
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    - host: {{ .Values.adminIngress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pertisk-ingress.fullname" . }}
                port:
                  number: {{ .Values.service.managementPort }}
  {{- if and .Values.adminIngress.tlsSecretName (ne (toString .Values.adminIngress.tlsSecretName) "") }}
  tls:
    - hosts:
        - {{ .Values.adminIngress.host }}
      secretName: {{ .Values.adminIngress.tlsSecretName }}
  {{- end }}
{{- end }}
