# 285h (Talos) — IngressClass mode.
# Deploy: VERSION=x.y.z ./deploy/285h.sh
#
# TPS / latency tuning:
# - runtime.mode=performance, proxyLog=false, logging.level=warn
# - CPU limit >= 2000m so autoWorkerThreads / Pingora get at least 2 workers
# - upstream HTTP/2 + H3 pools keep connections warm
# - http3.maxStreams >= concurrent clients (k6 VUs)
#
# HTTP/3 (QUIC): UDP must reach the same pod for a connection.
# Use sessionAffinity. For k6 HTTP/3 benchmarks pin one replica:
#   REPLICA_COUNT=1 VERSION=x.y.z ./deploy/285h.sh

http3Addr: "0.0.0.0:8443"

service:
  externalTrafficPolicy: Cluster
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

runtime:
  mode: performance
  autoWorkerThreads: true
  maxBlockingThreads: 2048
  listenerTasks: 4
  tcpListenBacklog: 8192
  proxyLog: false

logging:
  level: warn
  format: json

upstream:
  poolMaxIdlePerHost: 512
  poolIdleTimeoutSecs: 90
  h2KeepaliveSecs: 20
  h2KeepaliveTimeoutSecs: 10

h3Upstream:
  poolMaxIdlePerHost: 256
  poolIdleTimeoutSecs: 120
  tcpKeepaliveSecs: 60

http3:
  maxStreams: 2048
  streamReceiveWindow: 8388608
  connReceiveWindow: 67108864
  idleTimeoutSecs: 300
  keepaliveSecs: 10

resources:
  limits:
    cpu: "2"
    memory: 1Gi
  requests:
    cpu: "1"
    memory: 512Mi
