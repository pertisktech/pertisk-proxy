# PertiskBackend defines a reusable backend: upstreams, load balancing, and optional health check.
# PertiskIngress references it via spec.backendRef.name (same namespace).
# API group: proxy.pertisk.tech
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pertiskbackends.proxy.pertisk.tech
  labels:
    app.kubernetes.io/name: pertisk-ingress
    app.kubernetes.io/component: crd
spec:
  group: proxy.pertisk.tech
  names:
    kind: PertiskBackend
    listKind: PertiskBackendList
    plural: pertiskbackends
    singular: pertiskbackend
    shortNames:
      - pbackend
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          description: PertiskBackend defines upstreams and load balancing for the PTProxy.
          properties:
            spec:
              type: object
              description: Specification of the backend.
              properties:
                upstreams:
                  type: array
                  description: List of upstream addresses (host:port or Service name).
                  items:
                    type: object
                    required: [address]
                    properties:
                      address:
                        type: string
                        description: Upstream address (e.g. "my-svc:80", "10.0.0.1:8080").
                      weight:
                        type: integer
                        format: int32
                        minimum: 0
                        default: 1
                        description: Relative weight for load balancing.
                algorithm:
                  type: string
                  enum: [RoundRobin, LeastConnections, IpHash]
                  default: RoundRobin
                  description: Load balancing algorithm.
                healthPath:
                  type: string
                  description: Optional HTTP path for health checks (e.g. "/health").
                healthIntervalSeconds:
                  type: integer
                  format: int64
                  minimum: 1
                  default: 10
                  description: Interval in seconds between health checks.
              required: [upstreams]
            status:
              type: object
              description: Observed status (optional).
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: { type: string }
                      status: { type: string }
                      lastTransitionTime: { type: string }
                      reason: { type: string }
                      message: { type: string }
      additionalPrinterColumns:
        - name: Upstreams
          type: string
          jsonPath: .spec.upstreams[*].address
          description: Upstream addresses
        - name: Algorithm
          type: string
          jsonPath: .spec.algorithm
        - name: HealthPath
          type: string
          jsonPath: .spec.healthPath
          description: Optional HTTP health path
        - name: Interval
          type: integer
          jsonPath: .spec.healthIntervalSeconds
          description: Health check interval (seconds)
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
          description: Ready condition status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
