apiVersion: v1
kind: Namespace
metadata:
  name: pertisk-proxy
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pertisk-proxy
  namespace: pertisk-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pertisk-proxy
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pertisk-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pertisk-proxy
subjects:
  - kind: ServiceAccount
    name: pertisk-proxy
    namespace: pertisk-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pertisk-proxy
  namespace: pertisk-proxy
  labels:
    app: pertisk-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pertisk-proxy
  template:
    metadata:
      labels:
        app: pertisk-proxy
    spec:
      serviceAccountName: pertisk-proxy
      containers:
        - name: pertisk-proxy
          image: pertisk-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: https-udp
              containerPort: 8443
              protocol: UDP
          env:
            - name: MODE
              value: ingress
            - name: RUST_LOG
              value: info
            - name: LISTEN_HTTP
              value: "0.0.0.0:8080"
            - name: LISTEN_HTTPS
              value: "0.0.0.0:8443"
            - name: LISTEN_H3_UDP
              value: "0.0.0.0:8443"
            - name: ENABLE_H3
              value: "true"
            - name: INGRESS_CLASS
              value: pertisk
            - name: WATCH_ALL_NAMESPACES
              value: "true"
            - name: TLS_CERT_PATH
              value: /etc/tls/tls.crt
            - name: TLS_KEY_PATH
              value: /etc/tls/tls.key
          volumeMounts:
            - name: tls
              mountPath: /etc/tls
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
      volumes:
        - name: tls
          secret:
            secretName: pertisk-proxy-tls
---
apiVersion: v1
kind: Service
metadata:
  name: pertisk-proxy
  namespace: pertisk-proxy
spec:
  type: LoadBalancer
  selector:
    app: pertisk-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: https-udp
      port: 443
      targetPort: https-udp
      protocol: UDP
