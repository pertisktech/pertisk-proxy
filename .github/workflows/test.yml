name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Try native deps (or fall back to Docker)
        id: deps
        run: |
          set -euo pipefail
          if ./build/ci-install-deps.sh; then
            echo "mode=native" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v docker >/dev/null 2>&1; then
            echo "::warning::Native deps unavailable; running cargo test in Docker"
            echo "mode=docker" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Cannot install native deps and Docker is not available" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        if: steps.deps.outputs.mode == 'native'

      - name: Run library unit tests (native)
        if: steps.deps.outputs.mode == 'native'
        run: cargo test --lib --features ingress

      - name: Run library unit tests (Docker)
        if: steps.deps.outputs.mode == 'docker'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/app" -w /app \
            -e CARGO_HOME=/usr/local/cargo \
            rust:1-bookworm \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential cmake pkg-config libssl-dev perl clang libclang-dev
              cargo test --lib --features ingress
            '

  coverage:
    name: Coverage (95% gate)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Try native deps (or fall back to Docker)
        id: deps
        run: |
          set -euo pipefail
          if ./build/ci-install-deps.sh; then
            echo "mode=native" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if command -v docker >/dev/null 2>&1; then
            echo "::warning::Native deps unavailable; running tarpaulin in Docker"
            echo "mode=docker" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Cannot install native deps and Docker is not available" >&2
          exit 1

      - uses: dtolnay/rust-toolchain@stable
        if: steps.deps.outputs.mode == 'native'

      - name: Install tarpaulin
        if: steps.deps.outputs.mode == 'native'
        run: |
          set -euo pipefail
          if command -v cargo-tarpaulin >/dev/null; then
            cargo tarpaulin --version
            exit 0
          fi

          TARPAULIN_VERSION=0.35.4
          case "$(uname -m)" in
            x86_64) TARGET=x86_64-unknown-linux-gnu ;;
            aarch64|arm64) TARGET=aarch64-unknown-linux-gnu ;;
            *)
              echo "Unsupported runner architecture for tarpaulin: $(uname -m)" >&2
              exit 1
              ;;
          esac

          URL="https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-${TARGET}.tar.gz"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fsSL "$URL" -o "$TMP/tarpaulin.tar.gz"
          tar -xzf "$TMP/tarpaulin.tar.gz" -C "$TMP"
          mkdir -p "$HOME/.cargo/bin"
          install -m 755 "$TMP/cargo-tarpaulin" "$HOME/.cargo/bin/cargo-tarpaulin"
          cargo tarpaulin --version

      - name: Check line coverage (native)
        if: steps.deps.outputs.mode == 'native'
        run: cargo tarpaulin --config tarpaulin.toml --lib --features ingress

      - name: Check line coverage (Docker)
        if: steps.deps.outputs.mode == 'docker'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/app" -w /app \
            -e CARGO_HOME=/usr/local/cargo \
            rust:1-bookworm \
            bash -lc '
              set -euo pipefail
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential cmake pkg-config libssl-dev perl clang libclang-dev curl ca-certificates
              cargo install cargo-tarpaulin --locked || true
              if ! command -v cargo-tarpaulin >/dev/null; then
                TARPAULIN_VERSION=0.35.4
                case "$(uname -m)" in
                  x86_64) TARGET=x86_64-unknown-linux-gnu ;;
                  aarch64|arm64) TARGET=aarch64-unknown-linux-gnu ;;
                  *) echo "unsupported arch"; exit 1 ;;
                esac
                curl -fsSL "https://github.com/xd009642/tarpaulin/releases/download/${TARPAULIN_VERSION}/cargo-tarpaulin-${TARGET}.tar.gz" \
                  | tar -xz -C /usr/local/bin
              fi
              cargo tarpaulin --config tarpaulin.toml --lib --features ingress
            '
