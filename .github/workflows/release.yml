# Release on push tag — build binaries (amd64 + arm64) and create GitHub Release.
# Packages: proxy DEB/RPM/tarball, tunnel-server + tunnel-client DEB/RPM per arch.
# Docker: same as local Dockerfile multi-arch push (musl/alpine) via Harbor bases. Helm.

name: Release Packages

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

env:
  BINARY_NAME: pertisk-proxy
  # Override in repo Variables if paths differ in Harbor.
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'harbor.tools.pertisk.com' }}
  HARBOR_BUILD_IMAGE: ${{ vars.HARBOR_BUILD_IMAGE || 'harbor.tools.pertisk.com/pertisk-proxy/build' }}
  HARBOR_PROXY_IMAGE: ${{ vars.HARBOR_PROXY_IMAGE || 'harbor.tools.pertisk.com/pertisk-proxy/proxy' }}
  HARBOR_INGRESS_IMAGE: ${{ vars.HARBOR_INGRESS_IMAGE || 'harbor.tools.pertisk.com/pertisk-proxy/ingress' }}
  # Pre-pushed COPY-only runtime base (./build/ci-push-runtime-base.sh). Override via repo Variable.
  HARBOR_RUNTIME_IMAGE: ${{ vars.HARBOR_RUNTIME_IMAGE || 'harbor.tools.pertisk.com/pertisk-proxy/runtime:bookworm' }}
  # Musl Dockerfile CI bases (./build/ci-push-builder-image.sh + ./build/ci-push-alpine-runtime.sh).
  HARBOR_BUILDER_IMAGE: ${{ vars.HARBOR_BUILDER_IMAGE || 'harbor.tools.pertisk.com/pertisk-proxy/builder:alpine-rust' }}
  HARBOR_ALPINE_RUNTIME: ${{ vars.HARBOR_ALPINE_RUNTIME || 'harbor.tools.pertisk.com/pertisk-proxy/runtime:alpine' }}
  HELM_CHART_REPO_URL: ${{ vars.HELM_CHART_REPO_URL || 'https://chart.tools.pertisk.com' }}
  # Self-hosted runner ~16C/32GB: cargo/cmake parallelism (native path reads these).
  CARGO_BUILD_JOBS: "14"
  CMAKE_BUILD_PARALLEL_LEVEL: "14"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    runs-on: [self-hosted, linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            deb_arch: amd64
            rpm_arch: x86_64
          - goarch: arm64
            deb_arch: arm64
            rpm_arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Disable Docker keychain (macOS CI)
        run: |
          mkdir -p "$RUNNER_TEMP/.docker"
          echo '{"credsStore":""}' > "$RUNNER_TEMP/.docker/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/.docker" >> $GITHUB_ENV

      - name: Detect native build platform
        id: native_plat
        run: |
          case "$(uname -m)" in
            x86_64|amd64)
              echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"
              echo "arch=amd64" >> "$GITHUB_OUTPUT"
              ;;
            aarch64|arm64)
              echo "platform=linux/arm64" >> "$GITHUB_OUTPUT"
              echo "arch=arm64" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)"
              exit 1
              ;;
          esac
          echo "Runner UTC time: $(date -u '+%Y-%m-%d %H:%M:%S')"
          timedatectl status 2>/dev/null | grep -E 'synchronized|System clock' || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # docker-container driver isolates network/clock; apt GPG fails on some runners.
          # Cross-arch matrix jobs still use buildx; same-arch builds use host docker below.
          driver: docker

      - name: Set up QEMU for multi-arch builds
        if: matrix.goarch != steps.native_plat.outputs.arch
        uses: docker/setup-qemu-action@v3

      - name: Setup Node (for admin build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build admin UI
        run: |
          cd admin && pnpm install --frozen-lockfile && pnpm run build
        env:
          CI: true

      - name: Try native build deps (same-arch only)
        id: native_deps
        if: matrix.goarch == steps.native_plat.outputs.arch
        run: |
          set -euo pipefail
          chmod +x build/ci-install-deps.sh build/ci-release-native-bins.sh
          if ./build/ci-install-deps.sh; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Native deps unavailable; will use Docker for ${{ matrix.goarch }}"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Build proxy + ingress binaries (native)
        if: steps.native_deps.outputs.ok == 'true'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          ./build/ci-release-native-bins.sh ${{ matrix.goarch }} "$VERSION" all

      - name: Build proxy binary (Docker)
        if: steps.native_deps.outputs.ok != 'true'
        run: |
          set -euo pipefail
          chmod +x build/ci-docker-release.sh
          PLATFORM="linux/${{ matrix.goarch }}"
          OUT=".docker-out-proxy-${{ matrix.goarch }}"
          ./build/ci-docker-release.sh "$PLATFORM" "$OUT" \
            --build-arg PACKAGE_TARGET=proxy \
            --build-arg VERSION=${{ steps.version.outputs.VERSION }} \
            --build-arg CARGO_BUILD_JOBS=${{ env.CARGO_BUILD_JOBS }} \
            --build-arg RUST_IMAGE=${{ vars.HARBOR_RUST_BOOKWORM_IMAGE || 'harbor.tools.pertisk.com/pertisk-proxy/rust:1-bookworm' }}
          cp "$OUT/pertisk-proxy" ./${{ env.BINARY_NAME }}-linux-${{ matrix.goarch }}
          chmod +x ./${{ env.BINARY_NAME }}-linux-${{ matrix.goarch }}
          echo "Built proxy binary for linux/${{ matrix.goarch }}"

      - name: Build ingress binary (Docker)
        if: steps.native_deps.outputs.ok != 'true'
        run: |
          set -euo pipefail
          chmod +x build/ci-docker-release.sh
          PLATFORM="linux/${{ matrix.goarch }}"
          OUT=".docker-out-ingress-${{ matrix.goarch }}"
          ./build/ci-docker-release.sh "$PLATFORM" "$OUT" \
            --build-arg PACKAGE_TARGET=ingress \
            --build-arg VERSION=${{ steps.version.outputs.VERSION }} \
            --build-arg CARGO_BUILD_JOBS=${{ env.CARGO_BUILD_JOBS }} \
            --build-arg RUST_IMAGE=${{ vars.HARBOR_RUST_BOOKWORM_IMAGE || 'harbor.tools.pertisk.com/pertisk-proxy/rust:1-bookworm' }}
          cp "$OUT/pertisk-proxy-ingress" ./pertisk-proxy-ingress-linux-${{ matrix.goarch }}
          chmod +x ./pertisk-proxy-ingress-linux-${{ matrix.goarch }}
          echo "Built ingress binary for linux/${{ matrix.goarch }}"

      - name: Create package directories
        run: |
          mkdir -p pkg/usr/bin
          mkdir -p pkg/usr/share/pertisk-proxy/admin
          mkdir -p pkg/etc/pertisk-proxy
          mkdir -p pkg/etc/sysctl.d
          mkdir -p pkg/var/lib/pertisk-proxy
          mkdir -p pkg/var/log/pertisk-proxy
          mkdir -p pkg/lib/systemd/system

          cp ${{ env.BINARY_NAME }}-linux-${{ matrix.goarch }} pkg/usr/bin/${{ env.BINARY_NAME }}
          chmod +x pkg/usr/bin/${{ env.BINARY_NAME }}
          cp -r admin/dist pkg/usr/share/pertisk-proxy/admin/
          cp build/pertisk-proxy.conf pkg/etc/pertisk-proxy/pertisk-proxy.conf
          cp build/99-pertisk-proxy.conf pkg/etc/sysctl.d/99-pertisk-proxy.conf
          cp build/cpu-affinity.conf.example pkg/usr/share/pertisk-proxy/cpu-affinity.conf.example

      - name: Create systemd service files
        run: |
          cp build/pertisk-proxy.service pkg/lib/systemd/system/pertisk-proxy.service

          cat > pkg/lib/systemd/system/pertisk-proxy-root.service << 'EOF'
          [Unit]
          Description=pertisk-proxy reverse proxy (root)
          After=network.target
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          Group=root
          WorkingDirectory=/var/lib/pertisk-proxy
          EnvironmentFile=-/etc/pertisk-proxy/pertisk-proxy.conf
          ExecStart=/usr/bin/pertisk-proxy
          Restart=always
          RestartSec=5
          LimitNOFILE=1048576
          TasksMax=infinity
          StandardOutput=append:/var/log/pertisk-proxy/pertisk-proxy.log
          StandardError=append:/var/log/pertisk-proxy/pertisk-proxy.log
          ProtectSystem=full
          ProtectHome=true
          ReadWritePaths=/var/lib/pertisk-proxy /var/log/pertisk-proxy
          PrivateTmp=true
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Create pre/post install scripts
        run: |
          cat > preinstall.sh << 'EOF'
          #!/bin/sh
          set -e
          if ! getent group pertisk-proxy >/dev/null 2>&1; then
            groupadd --system pertisk-proxy
          fi
          if ! getent passwd pertisk-proxy >/dev/null 2>&1; then
            useradd --system --gid pertisk-proxy --home-dir /var/lib/pertisk-proxy \
              --shell /usr/sbin/nologin --comment "pertisk-proxy" pertisk-proxy
          fi
          EOF

          cat > postinstall.sh << 'EOF'
          #!/bin/sh
          set -e
          chown -R pertisk-proxy:pertisk-proxy /var/lib/pertisk-proxy
          chown -R pertisk-proxy:pertisk-proxy /var/log/pertisk-proxy
          chown -R pertisk-proxy:pertisk-proxy /usr/share/pertisk-proxy
          chmod 750 /var/lib/pertisk-proxy /var/log/pertisk-proxy
          if command -v setcap >/dev/null 2>&1; then
            if setcap 'cap_net_bind_service=+ep' /usr/bin/pertisk-proxy 2>/dev/null; then
              echo "Granted network binding capability to pertisk-proxy binary"
              getcap /usr/bin/pertisk-proxy | grep -q 'cap_net_bind_service=ep' && echo "Capabilities verified" || true
            else
              echo "Failed to set capabilities. Run: sudo setcap 'cap_net_bind_service=+ep' /usr/bin/pertisk-proxy"
            fi
          else
            echo "setcap not found. Install libcap2-bin (Debian) or libcap (RHEL), then setcap on /usr/bin/pertisk-proxy"
          fi
          if [ -f /etc/sysctl.d/99-pertisk-proxy.conf ]; then
            sysctl -p /etc/sysctl.d/99-pertisk-proxy.conf 2>/dev/null || true
            echo "Applied kernel tuning (UDP/TCP buffers, somaxconn, BBR) for pertisk-proxy"
          fi
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload
            echo ""
            echo "pertisk-proxy has been installed successfully!"
            echo "  sudo systemctl start pertisk-proxy"
            echo "  sudo systemctl enable pertisk-proxy"
            echo "Optional CPU pin: see /usr/share/pertisk-proxy/cpu-affinity.conf.example"
          fi
          EOF

          cat > preremove.sh << 'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl is-active --quiet pertisk-proxy && systemctl stop pertisk-proxy || true
            systemctl is-enabled --quiet pertisk-proxy 2>/dev/null && systemctl disable pertisk-proxy || true
          fi
          EOF

          chmod +x preinstall.sh postinstall.sh preremove.sh

      - name: Install host fpm (optional)
        run: |
          chmod +x build/ci-install-fpm.sh
          ./build/ci-install-fpm.sh || true

      - name: Build DEB and RPM packages
        env:
          BINARY_NAME: ${{ env.BINARY_NAME }}
          VERSION: ${{ steps.version.outputs.VERSION }}
          deb_arch: ${{ matrix.deb_arch }}
          rpm_arch: ${{ matrix.rpm_arch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Prefer host fpm; else AlmaLinux Docker image (not Debian apt).
          FORCE_DOCKER_FPM: "0"
        run: chmod +x build/ci-package-deb-rpm.sh && ./build/ci-package-deb-rpm.sh

      - name: Build tunnel DEB and RPM packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          # Host native (same-arch) or cargo-zigbuild (cross) — avoid Docker Hub pulls.
          FORCE_DOCKER_TUNNEL: "0"
          FORCE_DOCKER_FPM: "0"
          PERTISK_CARGO_JOBS: ${{ env.CARGO_BUILD_JOBS }}
        run: |
          set -euo pipefail
          chmod +x build/package-tunnel.sh build/ci-ensure-zig.sh
          ./build/package-tunnel.sh ${{ matrix.goarch }} ${{ steps.version.outputs.VERSION }} both

      - name: Verify packages before upload
        run: |
          set -euo pipefail
          echo "=== release/ contents (linux/${{ matrix.goarch }}) ==="
          ls -la release/
          # proxy + tunnel-server + tunnel-client
          test "$(find release -maxdepth 1 -name '*.deb' | wc -l)" -ge 3
          test "$(find release -maxdepth 1 -name '*.rpm' | wc -l)" -ge 3
          test "$(find release -maxdepth 1 -name 'pertisk-tunnel-*.deb' | wc -l)" -ge 2
          test "$(find release -maxdepth 1 -name 'pertisk-tunnel-*.rpm' | wc -l)" -ge 2

      - name: Create tarball
        run: |
          mkdir -p tarball/usr/bin tarball/admin
          cp pkg/usr/bin/${{ env.BINARY_NAME }} tarball/usr/bin/
          cp -r pkg/usr/share/pertisk-proxy/admin/dist tarball/admin/
          tar -czvf ${{ env.BINARY_NAME }}-v${{ steps.version.outputs.VERSION }}-linux-${{ matrix.goarch }}.tar.gz -C tarball usr admin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            ${{ env.BINARY_NAME }}-linux-${{ matrix.goarch }}
            pertisk-proxy-ingress-linux-${{ matrix.goarch }}
            admin/dist/
            release/*.deb
            release/*.rpm
            *.tar.gz
          retention-days: 1

  docker-build:
    name: Docker multi-arch images
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configure Docker
        run: |
          DOCKER_TEMP_DIR="$RUNNER_TEMP/.docker"
          mkdir -p "$DOCKER_TEMP_DIR"
          echo '{"auths":{},"credsStore":"","credHelpers":{}}' > "$DOCKER_TEMP_DIR/config.json"
          echo "DOCKER_CONFIG=$DOCKER_TEMP_DIR" >> $GITHUB_ENV

      - name: Login to container registry
        run: |
          export DOCKER_CONFIG="${{ env.DOCKER_CONFIG }}"
          AUTH=$(echo -n "${{ secrets.HARBOR_USERNAME }}:${{ secrets.HARBOR_PASSWORD }}" | base64)
          REGISTRY="${{ env.CONTAINER_REGISTRY }}"
          mkdir -p "$DOCKER_CONFIG"
          echo "{\"auths\":{\"$REGISTRY\":{\"auth\":\"$AUTH\"}},\"credsStore\":\"\",\"credHelpers\":{}}" > "$DOCKER_CONFIG/config.json"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - name: Setup Node (admin UI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Build admin UI
        run: |
          cd admin && pnpm install --frozen-lockfile && pnpm run build
        env:
          CI: true

      - name: Verify Harbor builder + alpine runtime
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${{ env.DOCKER_CONFIG }}"
          for img in "${{ env.HARBOR_BUILDER_IMAGE }}" "${{ env.HARBOR_ALPINE_RUNTIME }}"; do
            if ! docker buildx imagetools inspect "$img" >/dev/null 2>&1; then
              echo "::error::Missing $img — from a networked machine run:"
              echo "  ./build/ci-push-builder-image.sh"
              echo "  ./build/ci-push-alpine-runtime.sh"
              exit 1
            fi
            echo "OK $img"
          done

      - name: Build and push ingress (same as local Dockerfile)
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${{ env.DOCKER_CONFIG }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          INGRESS="${{ env.HARBOR_INGRESS_IMAGE }}"
          # Matches: docker buildx build -f Dockerfile --platform linux/amd64,linux/arm64 --push
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --network=host \
            -f Dockerfile \
            --build-arg "RUST_IMAGE=${{ env.HARBOR_BUILDER_IMAGE }}" \
            --build-arg "ALPINE_IMAGE=${{ env.HARBOR_ALPINE_RUNTIME }}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg SKIP_BUILD_DEPS=1 \
            --build-arg SKIP_RUNTIME_APK=1 \
            -t "${INGRESS}:${VERSION}" \
            -t "${INGRESS}:v${VERSION}" \
            -t "${INGRESS}:latest" \
            --push \
            .

      - name: Build and push proxy (Dockerfile.proxy)
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${{ env.DOCKER_CONFIG }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          PROXY="${{ env.HARBOR_PROXY_IMAGE }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --network=host \
            -f Dockerfile.proxy \
            --build-arg "RUST_IMAGE=${{ env.HARBOR_BUILDER_IMAGE }}" \
            --build-arg "ALPINE_IMAGE=${{ env.HARBOR_ALPINE_RUNTIME }}" \
            --build-arg "VERSION=${VERSION}" \
            --build-arg SKIP_BUILD_DEPS=1 \
            --build-arg SKIP_RUNTIME_APK=1 \
            -t "${PROXY}:${VERSION}" \
            -t "${PROXY}:v${VERSION}" \
            -t "${PROXY}:latest" \
            --push \
            .

      - name: Summary
        run: |
          echo "## Docker Images Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Same path as local \`Dockerfile\` multi-arch musl/alpine build (Harbor builder + runtime:alpine)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Ingress" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_INGRESS_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_INGRESS_IMAGE }}:v${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_INGRESS_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Proxy" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_PROXY_IMAGE }}:${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_PROXY_IMAGE }}:v${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_PROXY_IMAGE }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

  helm-publish:
    name: Publish Helm chart
    needs: docker-build
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        run: |
          set -euo pipefail
          if command -v helm >/dev/null 2>&1; then
            helm version
            exit 0
          fi
          HELM_VERSION="${HELM_VERSION:-3.21.1}"
          HELM_INSTALL_DIR="${HOME}/.local/bin"
          mkdir -p "$HELM_INSTALL_DIR"
          case "$(uname -m)" in
            x86_64|amd64) HELM_ARCH=amd64 ;;
            aarch64|arm64) HELM_ARCH=arm64 ;;
            *)
              echo "unsupported architecture for helm: $(uname -m)" >&2
              exit 1
              ;;
          esac
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz" -o "$TMP/helm.tgz"
          tar -xzf "$TMP/helm.tgz" -C "$TMP"
          install -m 755 "$TMP/linux-${HELM_ARCH}/helm" "$HELM_INSTALL_DIR/helm"
          echo "$HELM_INSTALL_DIR" >> "$GITHUB_PATH"
          helm version

      - name: Publish pertisk-ingress chart
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          HELM_CHART_REPO_URL: ${{ env.HELM_CHART_REPO_URL }}
          HELM_CHART_TOKEN: ${{ secrets.HELM_CHART_TOKEN }}
          HELM_USER: ${{ secrets.HELM_USER }}
          HELM_PASSWORD: ${{ secrets.HELM_PASSWORD }}
          HARBOR_INGRESS_IMAGE: ${{ env.HARBOR_INGRESS_IMAGE }}
        run: chmod +x build/publish-helm-ingress.sh && ./build/publish-helm-ingress.sh

      - name: Summary
        run: |
          echo "## Helm Chart Published" >> $GITHUB_STEP_SUMMARY
          echo "**Chart:** pertisk-ingress ${{ steps.version.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** ${{ env.HELM_CHART_REPO_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.HARBOR_INGRESS_IMAGE }}:v${{ steps.version.outputs.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm repo add pertisk ${{ env.HELM_CHART_REPO_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "helm repo update" >> $GITHUB_STEP_SUMMARY
          echo "helm upgrade --install pertisk-proxy-ingress pertisk/pertisk-ingress \\" >> $GITHUB_STEP_SUMMARY
          echo "  --version ${{ steps.version.outputs.VERSION }} -n pertisk-proxy --create-namespace" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: packages
          merge-multiple: true

      - name: List packages
        run: |
          set -euo pipefail
          echo "=== Listing packages directory ==="
          find packages -type f | sort
          deb_count=$(find packages -name '*.deb' | wc -l | tr -d ' ')
          rpm_count=$(find packages -name '*.rpm' | wc -l | tr -d ' ')
          tunnel_rpm=$(find packages -name 'pertisk-tunnel-*.rpm' | wc -l | tr -d ' ')
          tunnel_deb=$(find packages -name 'pertisk-tunnel-*.deb' | wc -l | tr -d ' ')
          echo "deb=${deb_count} rpm=${rpm_count} tunnel_deb=${tunnel_deb} tunnel_rpm=${tunnel_rpm}"
          # 2 arches × (proxy + tunnel-server + tunnel-client)
          if [ "$rpm_count" -lt 6 ]; then
            echo "::error::Expected at least 6 RPM files (proxy + tunnel × amd64/arm64), found ${rpm_count}"
            exit 1
          fi
          if [ "$deb_count" -lt 6 ]; then
            echo "::error::Expected at least 6 DEB files (proxy + tunnel × amd64/arm64), found ${deb_count}"
            exit 1
          fi
          if [ "$tunnel_rpm" -lt 4 ] || [ "$tunnel_deb" -lt 4 ]; then
            echo "::error::Expected at least 4 tunnel DEB and 4 tunnel RPM (server+client × 2 arch)"
            exit 1
          fi

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd packages
          shopt -s globstar nullglob
          files=( **/*.deb **/*.rpm **/*.tar.gz )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release assets found in packages/"
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HARBOR_PROXY_IMAGE: ${{ env.HARBOR_PROXY_IMAGE }}
          HARBOR_INGRESS_IMAGE: ${{ env.HARBOR_INGRESS_IMAGE }}
          HELM_CHART_REPO_URL: ${{ env.HELM_CHART_REPO_URL }}
          PACKAGES_DIR: packages
        run: |
          chmod +x build/ci-release-body.sh
          ./build/ci-release-body.sh > packages/RELEASE_BODY.md
          echo "=== Release body preview ==="
          cat packages/RELEASE_BODY.md
          grep -q '\.rpm' packages/RELEASE_BODY.md

      - name: Publish GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TAG: v${{ steps.version.outputs.VERSION }}
          PACKAGES_DIR: packages
          NOTES_FILE: packages/RELEASE_BODY.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          chmod +x build/ci-install-gh.sh build/ci-publish-release.sh
          ./build/ci-publish-release.sh
