[package]
name = "pertisk-tunnel-proto"
version = "0.1.0"
edition = "2021"
description = "Wire protocol for pertisk reverse tunnel (QUIC + token auth)"
license = "Apache-2.0"

[dependencies]
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["io-util", "macros", "rt"] }
